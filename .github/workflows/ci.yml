name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ hashFiles('**/moon.mod') }}
          restore-keys: mooncakes-

      - name: Update MoonBit registry
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Format
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: Test
        run: moon test

      - name: Example smoke test
        run: |
          moon build
          moon cram test examples/todo/tests
