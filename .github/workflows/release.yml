name: Release

# Publishing only. CI on the pushed commit is the verification gate; a
# published release asserts that the tag was already verified. The workflow
# checks the tag matches every published moon.mod and publishes the modules
# to mooncakes in dependency order.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to mooncakes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for mod in core sqlite postgresql; do
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "${mod}/moon.mod")"
            if [[ "${GITHUB_REF_NAME}" == "v${version}" ]]; then
              matched=1
            fi
          done
          if [[ "${matched}" -eq 0 ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match any module version in core/sqlite/postgresql" >&2
            exit 1
          fi

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "${HOME}/.moon/bin" >> "${GITHUB_PATH}"

      - name: Publish to mooncakes
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          set -euo pipefail
          moon version --all
          moon update
          username="$(sed -n 's/^name = "\([^/]*\)\/.*"/\1/p' core/moon.mod)"
          mkdir -p "${HOME}/.moon"
          printf '{"token":"%s","username":"%s"}' \
            "${MOONCAKES_TOKEN}" "${username}" > "${HOME}/.moon/credentials.json"

          wait_for_registry() (
            local name="$1" version="$2"
            local probe attempt
            probe="$(mktemp -d)"
            trap 'rm -rf "${probe}"' EXIT
            printf 'name = "release/index_probe"\nimport {\n  "%s@%s",\n}\n' \
              "${name}" "${version}" > "${probe}/moon.mod"
            for attempt in $(seq 1 60); do
              echo "Waiting for ${name}@${version} in the dependency index (${attempt}/60)..."
              if moon update && MOON_WORK=off moon -C "${probe}" tree; then
                return 0
              fi
              if [[ "${attempt}" -lt 60 ]]; then
                sleep 5
              fi
            done
            echo "::error::${name}@${version} is still unavailable in the dependency index" >&2
            return 1
          )

          publish_if_needed() {
            local dir="$1"
            local wait_index="${2:-false}"
            local name version
            name="$(sed -n 's/^name = "\([^"]*\)"/\1/p' "${dir}/moon.mod")"
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "${dir}/moon.mod")"
            if moon view "${name}@${version}" > /dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
            else
              echo "Publishing ${name}@${version}..."
              moon -C "${dir}" publish
            fi
            if [[ "${wait_index}" == "true" ]]; then
              wait_for_registry "${name}" "${version}"
            fi
          }

          publish_if_needed core true
          publish_if_needed sqlite false
          publish_if_needed postgresql false
