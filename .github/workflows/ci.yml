name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ hashFiles('**/moon.mod') }}
          restore-keys: mooncakes-

      - name: Install aarch64 moon-cram
        if: matrix.os == 'ubuntu-24.04-arm'
        # The linux-aarch64 toolchain tarball bundles an x86-64 moon-cram
        # binary; replace it with the real aarch64 release.
        run: |
          curl -fsSL https://github.com/moonbitlang/moon-cram/releases/download/v0.0.2/moon-cram-v0.0.2-linux-aarch64.tar.gz |
            tar -xz --strip-components=1 -C "$HOME/.moon/bin"

      - name: Update MoonBit registry
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Format
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: Test
        run: moon test

      - name: Example smoke test
        run: |
          moon build
          moon cram test examples/todo/tests
