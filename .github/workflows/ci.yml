name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ hashFiles('**/moon.mod') }}
          restore-keys: mooncakes-

      - name: Install MariaDB Connector/C
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Update MoonBit registry
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Format
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: Test
        run: moon test

      # Build only the example binary and invoke moon-cram directly: packages
      # with `link` options (mysql's libmariadb flags) would otherwise be
      # exe-linked by the whole-workspace build inside `moon cram test` and
      # fail for lack of `main`.
      - name: Example smoke test
        run: |
          moon build examples/todo
          PATH="$PWD/_build/native/debug/build/xziheng/moondark_example_todo:$PATH" moon-cram test examples/todo/tests
