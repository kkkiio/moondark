name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: mooncakes-${{ hashFiles('**/moon.mod') }}
          restore-keys: mooncakes-

      - name: Update MoonBit registry
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Format
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: Test
        run: moon test

      - name: Example smoke test
        run: moon build

      # moon-cram ships no working linux-aarch64 binary (the v0.0.1/v0.0.2
      # aarch64 release assets are actually x86-64), so cram coverage stays
      # on x64 until upstream fixes the cross-compile.
      - name: Cram smoke test
        if: matrix.os == 'ubuntu-latest'
        run: moon cram test examples/todo/tests
